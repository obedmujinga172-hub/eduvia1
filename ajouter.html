{% extends "base.html" %}
{% block titre %}Créer un compte{% endblock %}

{% block contenu %}
    <h2 class="mb-4">Créer un compte utilisateur</h2>

    <form method="post" enctype="multipart/form-data" style="max-width: 500px;">
        <div class="mb-3">
            <label class="form-label">Photo (optionnel)</label>
            <input type="file" name="photo" class="form-control" accept=".png,.jpg,.jpeg">
        </div>
        <div class="mb-3">
            <label class="form-label">Nom complet *</label>
            <input type="text" name="nom_complet" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email *</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Mot de passe *</label>
            <input type="password" name="mot_de_passe" class="form-control" required minlength="6">
        </div>
        <div class="mb-3">
            <label class="form-label">Rôle *</label>
            <select name="role" class="form-select" required>
                {% for valeur, libelle in noms_roles.items() %}
                    <option value="{{ valeur }}">{{ libelle }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Élève associé <span class="text-muted">(uniquement si rôle = Élève)</span></label>
            <select name="id_eleve" class="form-select">
                <option value="">-- Aucun --</option>
                {% for eleve in eleves %}
                    <option value="{{ eleve.id }}">{{ eleve.nom }} {{ eleve.postnom }} {{ eleve.prenom }} ({{ eleve.matricule }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Enfant(s) associé(s) <span class="text-muted">(uniquement si rôle = Parent/Tuteur)</span></label>
            <select name="ids_enfants" class="form-select" multiple size="5">
                {% for eleve in eleves %}
                    <option value="{{ eleve.id }}">{{ eleve.nom }} {{ eleve.postnom }} {{ eleve.prenom }} ({{ eleve.matricule }})</option>
                {% endfor %}
            </select>
            <small class="text-muted">Maintenez Ctrl (ou Cmd) enfoncé pour sélectionner plusieurs enfants.</small>
        </div>

        <div class="mb-3">
            <label class="form-label">Matricule enseignant <span class="text-muted">(uniquement si rôle = Enseignant)</span></label>
            <input type="text" name="matricule_enseignant" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Spécialité <span class="text-muted">(uniquement si rôle = Enseignant)</span></label>
            <input type="text" name="specialite" class="form-control" placeholder="Ex: Mathématiques">
        </div>

        <button type="submit" class="btn btn-success">Créer le compte</button>
        <a href="{{ url_for('liste_utilisateurs') }}" class="btn btn-secondary">Annuler</a>
    </form>
{% endblock %}
