{% extends "base.html" %}
{% block titre %}{{ "Modifier" if message else "Nouveau" }} message{% endblock %}

{% block contenu %}
    <h2 class="mb-4">{{ "Modifier le message" if message else "Nouveau message" }}</h2>

    <form method="post" style="max-width: 700px;">
        <div class="mb-3">
            <label class="form-label">Titre *</label>
            <input type="text" name="titre" class="form-control" required value="{{ message.titre if message else '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Contenu *</label>
            <textarea name="contenu" class="form-control" rows="6" required>{{ message.contenu if message else '' }}</textarea>
        </div>
        <button type="submit" class="btn btn-success">{{ "Enregistrer" if message else "Publier" }}</button>
        <a href="{{ url_for('liste_messages') }}" class="btn btn-secondary">Annuler</a>
    </form>
{% endblock %}
