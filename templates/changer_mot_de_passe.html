{% extends "base.html" %}
{% block titre %}Changer mon mot de passe{% endblock %}

{% block contenu %}
    <h2 class="mb-4">Changer mon mot de passe</h2>

    <form method="post" style="max-width: 450px;">
        <div class="mb-3">
            <label class="form-label">Mot de passe actuel *</label>
            <input type="password" name="mot_de_passe_actuel" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Nouveau mot de passe *</label>
            <input type="password" name="nouveau_mot_de_passe" class="form-control" required minlength="6">
        </div>
        <div class="mb-3">
            <label class="form-label">Confirmer le nouveau mot de passe *</label>
            <input type="password" name="confirmation" class="form-control" required minlength="6">
        </div>
        <button type="submit" class="btn btn-success">Changer le mot de passe</button>
        <a href="{{ url_for('profil') }}" class="btn btn-secondary">Annuler</a>
    </form>
{% endblock %}
