<!--
    Ce fichier contient uniquement les champs du formulaire.
    Il est inclus à la fois dans ajouter.html et modifier.html
    pour ne pas écrire deux fois le même code.
    La variable "eleve" existe seulement en mode modification.
-->
<div class="row g-3">

    <div class="col-md-3 text-center">
        {% if eleve and eleve.chemin_photo %}
            <img src="/{{ eleve.chemin_photo }}" class="rounded mb-2" style="width:120px;height:120px;object-fit:cover;" alt="Photo">
        {% else %}
            <div class="rounded bg-light d-flex align-items-center justify-content-center mb-2 mx-auto" style="width:120px;height:120px;">
                <span class="text-muted">Aucune photo</span>
            </div>
        {% endif %}
        <input type="file" name="photo" class="form-control form-control-sm" accept=".png,.jpg,.jpeg">
    </div>

    <div class="col-md-9">
    <div class="row g-3">

    <div class="col-md-3">
        <label class="form-label">Matricule *</label>
        <input type="text" name="matricule" class="form-control" required
               value="{{ eleve.matricule if eleve else '' }}">
    </div>

    <div class="col-md-3">
        <label class="form-label">Nom *</label>
        <input type="text" name="nom" class="form-control" required
               value="{{ eleve.nom if eleve else '' }}">
    </div>

    <div class="col-md-3">
        <label class="form-label">Postnom</label>
        <input type="text" name="postnom" class="form-control"
               value="{{ eleve.postnom if eleve else '' }}">
    </div>

    <div class="col-md-3">
        <label class="form-label">Prénom</label>
        <input type="text" name="prenom" class="form-control"
               value="{{ eleve.prenom if eleve else '' }}">
    </div>

    <div class="col-md-3">
        <label class="form-label">Sexe *</label>
        <select name="sexe" class="form-select" required>
            <option value="">-- Choisir --</option>
            <option value="M" {% if eleve and eleve.sexe == 'M' %}selected{% endif %}>Masculin</option>
            <option value="F" {% if eleve and eleve.sexe == 'F' %}selected{% endif %}>Féminin</option>
        </select>
    </div>

    <div class="col-md-3">
        <label class="form-label">Date de naissance</label>
        <input type="date" name="date_naissance" class="form-control"
               value="{{ eleve.date_naissance if eleve else '' }}">
    </div>

    <div class="col-md-6">
        <label class="form-label">Lieu de naissance</label>
        <input type="text" name="lieu_naissance" class="form-control"
               value="{{ eleve.lieu_naissance if eleve else '' }}">
    </div>

    <div class="col-md-6">
        <label class="form-label">Classe *</label>
        <select name="id_classe" class="form-select" required>
            <option value="">-- Choisir --</option>
            {% for classe in classes %}
                <option value="{{ classe.id }}" {% if eleve and eleve.id_classe == classe.id %}selected{% endif %}>
                    {{ classe.niveau }} - {{ classe.nom }}{% if classe.nom_option %} ({{ classe.nom_option }}){% endif %}
                </option>
            {% endfor %}
        </select>
        {% if classes|length == 0 %}
            <div class="form-text text-danger">
                Aucune classe configurée. Rendez-vous dans le menu "Classes" pour en créer une d'abord.
            </div>
        {% endif %}
    </div>

    <div class="col-md-4">
        <label class="form-label">Nom du parent/tuteur</label>
        <input type="text" name="nom_parent" class="form-control"
               value="{{ eleve.nom_parent if eleve else '' }}">
    </div>

    <div class="col-md-4">
        <label class="form-label">Contact du parent</label>
        <input type="text" name="contact_parent" class="form-control" placeholder="Ex: 09XXXXXXXX"
               value="{{ eleve.contact_parent if eleve else '' }}">
    </div>

    <div class="col-md-8">
        <label class="form-label">Adresse</label>
        <input type="text" name="adresse" class="form-control"
               value="{{ eleve.adresse if eleve else '' }}">
    </div>

    </div>
    </div>

</div>
