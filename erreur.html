{% extends "base.html" %}
{% block titre %}Accès refusé{% endblock %}

{% block contenu %}
    <div class="text-center py-5">
        <i class="bi bi-shield-exclamation" style="font-size:3rem; color: var(--sky-400);"></i>
        <h1 class="display-1" style="color: var(--sky-600);">{{ code }}</h1>
        <p class="lead text-muted">{{ message }}</p>
        <a href="{{ url_for('accueil') }}" class="btn btn-primary mt-2"><i class="bi bi-house-door"></i> Retour à l'accueil</a>
    </div>
{% endblock %}
